      embeddedRefreshTimer=setTimeout(async()=>{try{await refreshEmbeddedState();}catch(error){renderConnectionError(error);}finally{scheduleEmbeddedRefresh();}},delay);
    }
    function scheduleApiRefresh(delayOverride=null) {
      if(apiRefreshTimer)clearTimeout(apiRefreshTimer);
      const base=Math.max(1000,pageRefreshSeconds()*1000), multiplier=apiRetryAttempt?Math.min(30,2**Math.max(0,apiRetryAttempt-1)):1, delay=delayOverride===null?Math.min(60000,base*multiplier):Math.max(0,delayOverride);
      apiRefreshTimer=setTimeout(runApiRefresh,delay);
    }
    async function runApiRefresh() {
      if(apiLoadInFlight){scheduleApiRefresh();return;}
      apiLoadInFlight=true;
      const recovering=apiRetryAttempt>0||Boolean(lastApiError);
      try{await loadState();apiRetryAttempt=0;lastApiError="";if(recovering)pulseStateEvent("connection");}
      catch(error){if(error?.name!=="AbortError"){apiRetryAttempt=Math.min(8,apiRetryAttempt+1);renderConnectionError(error);}}
      finally{apiLoadInFlight=false;updateProblemHealth();scheduleApiRefresh();}
    }
    function brushData() {
      const data=primaryRows(aggregate(cachedState?.rows||[]));
      return chartSelection?data.filter(row=>{const time=new Date(row.timestamp).getTime();return time>=chartSelection.start&&time<=chartSelection.end;}):data;
    }
    function brushTimeFromPointer(event) {
      const canvas=$("cpuChart"), rect=canvas.getBoundingClientRect(), padLeft=56, padRight=18, ratio=Math.max(0,Math.min(1,(event.clientX-rect.left-padLeft)/Math.max(1,rect.width-padLeft-padRight))), data=brushData();
      if(!data.length) return null;
      return new Date(data[Math.round(ratio*(data.length-1))].timestamp).getTime();
    }
    function memoryBrushData() {
      const data=primaryRows(aggregate(cachedState?.rows||[]));
      return memoryChartSelection?data.filter(row=>{const time=new Date(row.timestamp).getTime();return time>=memoryChartSelection.start&&time<=memoryChartSelection.end;}):data;
    }

      if(!data.length) return null;
      return new Date(data[Math.round(ratio*(data.length-1))].timestamp).getTime();
    }
